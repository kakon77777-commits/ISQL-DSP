[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isql-dsr-runtime"
version = "0.7.0"
description = "ISQL Dynamic Spectrum Runtime v0.7: guarded capability-aware native VM programs, subprogram calls, and atomic multi-state transactions."
requires-python = ">=3.11"
authors = [{name = "Neo.K / EVEMISSLAB"}]

[project.scripts]
isql-dsr = "isql_dsr.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
