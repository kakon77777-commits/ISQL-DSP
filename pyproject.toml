[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isql-dsr-runtime"
version = "0.4.0"
description = "ISQL Dynamic Spectrum Runtime v0.4: append-only machine symbol registry, registered native snapshots, replayable native event streams, and Core R4 registered bridges."
requires-python = ">=3.11"
authors = [{name = "Neo.K / EVEMISSLAB"}]

[project.scripts]
isql-dsr = "isql_dsr.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
