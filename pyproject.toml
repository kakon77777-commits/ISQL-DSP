[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isql-dsr-runtime"
version = "0.2.0"
description = "ISQL Dynamic Spectrum Runtime: topology-aware finite-active spectra, uncertainty-aware fusion, replayable semantic state, and Core SEM/STATE numeric wire bridge."
requires-python = ">=3.11"
authors = [{name = "Neo.K / EVEMISSLAB"}]

[project.scripts]
isql-dsr = "isql_dsr.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
