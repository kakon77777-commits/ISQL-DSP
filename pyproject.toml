[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isql-dsr-runtime"
version = "1.0.0"
description = "ISQL Dynamic Spectrum Runtime v1.0: typed composite machine values, bounded native iteration, typed signatures, and semantics-preserving optimization."
requires-python = ">=3.11"
authors = [{name = "Neo.K / EVEMISSLAB"}]

[project.scripts]
isql-dsr = "isql_dsr.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
