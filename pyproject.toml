[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isql-dsr-runtime"
version = "0.3.0"
description = "ISQL Dynamic Spectrum Runtime v0.3: AI-native canonical binary state, numeric event opcodes, replayable spectral semantics, topology, fusion, and Core R3/DSRN bridge."
requires-python = ">=3.11"
authors = [{name = "Neo.K / EVEMISSLAB"}]

[project.scripts]
isql-dsr = "isql_dsr.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
